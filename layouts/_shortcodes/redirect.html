<meta http-equiv="refresh" content="{{ .Get 1 }};URL={{ .Get 0}}">

<p>
  You should have been redirected to this URL <code>{{ .Get 0 }}</code>
</p>

<p>
  If not manually click <a href="{{ .Get 0 }}">here</a>
</p>

<script>
const url = "{{ .Get 0 }}";
const seconds = {{ .Get 1}};

setTimeout(() => {
    window.location.href = url;
}, seconds * 1000 + 1000);
</script>
